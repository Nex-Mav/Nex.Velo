# The Nex.Velo Worker on Cloudflare: website + API + ad-free keys + Wisp, all in one.
# Deployed by .github/workflows/deploy-api-worker.yml (it builds public/ first). Live at https://nex-velo.nexero.workers.dev
name = "nex-velo"
main = "index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# The website (public/). Requests that match a file are answered from here; everything else reaches the Worker code.
[assets]
directory = "../public"
binding = "ASSETS"

# Nex.AI: Cloudflare Workers AI (no key needed; the free plan has a daily allowance)
[ai]
binding = "AI"

# Ad-free keys (optional, add this later): create a KV namespace (dashboard: Storage & Databases > KV > Create),
# paste its id below and remove the leading # from the three lines. Use the SAME namespace as worker/wrangler.toml so keys match.
# Until then the site, API, AI and Wisp all work; only the ad-free key tools do not.
# [[kv_namespaces]]
# binding = "KEYS"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# "Visitors online" counter
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveCounter"]

# Secrets (add them in the dashboard: Workers > nex-velo > Settings > Variables and Secrets), none are in this file:
#   ADMIN_CODE      the admin code for the ad-free key tools
#   GROQ_API_KEY    optional: lets the AI describe images, and answer if Workers AI is unavailable
#   GITHUB_TOKEN    optional: avoids GitHub's rate limit when reading the game lists
#   SOUNDCLOUD_CLIENT_ID, PIPED_INSTANCES  optional
