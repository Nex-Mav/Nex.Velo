# Deploys the Wisp server (wisp-worker/) to Cloudflare Workers whenever it or lib/wisp-cf.js changes (or from the Actions tab).
# Uses the same two repository secrets as the key server: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" permission) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy Wisp server

on:
  workflow_dispatch:
  push:
    paths: ["wisp-worker/**", "lib/wisp-cf.js"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: wisp-worker
