# Builds the site and publishes it on Cloudflare Pages, together with the Wisp function in functions/.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# Create the Pages project once first (dashboard: Workers & Pages > Create > Pages > Direct Upload, name it nex-velo),
# or run: npx wrangler pages project create nex-velo --production-branch main
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "wisp-worker/**", "README.md"]

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Copy the proxy files into public/
        run: node scripts/copy-assets.js
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=nex-velo --branch=main --commit-dirty=true
