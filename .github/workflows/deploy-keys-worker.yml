# Deploys worker/key-worker.js to Cloudflare whenever it changes (or from the Actions tab).
# Add two repository secrets first: CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers" permission) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy key server

on:
  workflow_dispatch:
  push:
    paths: ["worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
